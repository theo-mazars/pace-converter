server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_min_length 256;
    gzip_types text/css application/javascript image/svg+xml;

    # The page has one inline script and one inline stylesheet, hence 'unsafe-inline'.
    # Nothing is loaded from other sites and nothing is sent anywhere.
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # HTML is revalidated on every visit so a redeploy shows up straight away.
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    # Fonts keep their file names, so cache for a month rather than forever.
    location /fonts/ {
        try_files $uri =404;
        expires 30d;
    }

    location = /favicon.svg {
        expires 7d;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
